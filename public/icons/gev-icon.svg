<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0d1a22"/><stop offset="1" stop-color="#03070a"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1f4d5c"/><stop offset="0.7" stop-color="#0b2a36"/><stop offset="1" stop-color="#04131a"/>
    </radialGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#b8ffe9"/><stop offset="0.35" stop-color="#3cf0c4"/><stop offset="1" stop-color="#0a7a66"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipGlobe"><circle cx="512" cy="512" r="330"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- scan grid -->
  <g stroke="#2ee6c0" stroke-opacity="0.10" stroke-width="2">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>
  <!-- outer HUD ring -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="#2ee6c0" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="40 26"/>
  <circle cx="512" cy="512" r="392" fill="none" stroke="#2ee6c0" stroke-opacity="0.18" stroke-width="2"/>
  <!-- globe -->
  <circle cx="512" cy="512" r="330" fill="url(#globe)"/>
  <g clip-path="url(#clipGlobe)" fill="none" stroke="#3cf0c4" stroke-opacity="0.45" stroke-width="5">
    <ellipse cx="512" cy="512" rx="330" ry="120"/><ellipse cx="512" cy="512" rx="330" ry="240"/>
    <ellipse cx="512" cy="512" rx="120" ry="330"/><ellipse cx="512" cy="512" rx="240" ry="330"/>
    <path d="M182 512H842M512 182V842"/>
  </g>
  <!-- eye -->
  <g filter="url(#glow)">
    <path d="M232 512 Q512 300 792 512 Q512 724 232 512Z" fill="#031a1c" stroke="#3cf0c4" stroke-width="16"/>
    <circle cx="512" cy="512" r="118" fill="url(#iris)"/>
    <circle cx="512" cy="512" r="52" fill="#02110f"/>
    <circle cx="472" cy="470" r="22" fill="#e8fff8" fill-opacity="0.9"/>
  </g>
  <!-- targeting ticks -->
  <g stroke="#3cf0c4" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
    <path d="M140 380V220H300M884 380V220H724M140 644V804H300M884 644V804H724"/>
  </g>
</svg>
